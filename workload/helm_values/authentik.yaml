global:
  podAnnotations:
    checksum/blueprints: "${blueprint_checksum}"
  env:
    - name: AUTHENTIK_WEB__WORKERS
      value: "1"
    - name: AUTHENTIK_WEB__THREADS
      value: "4"
    - name: PYTHONOPTIMIZE
      value: "1"
    - name: MALLOC_TRIM_THRESHOLD_
      value: "65536"
    - name: MALLOC_ARENA_MAX
      value: "2"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - home
  tolerations:
    - key: "node.kubernetes.io/not-ready"
      operator: "Exists"
      effect: "NoExecute"
      tolerationSeconds: 60
    - key: "node.kubernetes.io/unreachable"
      operator: "Exists"
      effect: "NoExecute"
      tolerationSeconds: 60

authentik:
  secret_key: "${secret_key}"
  error_reporting:
    enabled: false
  postgresql:
    host: "shared-db-rw.cnpg-system.svc.cluster.local"
    name: "authentik"
    user: "authentik"
    password: "${db_password}"
    port: 5432
  email:
    host: "mailpit.apn.svc.cluster.local"
    port: 1025
    use_tls: false
    use_ssl: false
    from: "authentik@kms-lab.in.ua"

blueprints:
  secrets:
    - authentik-blueprints

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi
  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      gatus.io/status: "[STATUS] == 200 || [STATUS] == 302"
    hosts:
      - auth.kms-lab.in.ua

worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi

postgresql:
  enabled: false
