version: 1
metadata:
  name: KMS-Lab Applications & SSO Providers
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ============================================================================
  # 1. Paperless-ngx (OIDC Provider & Application)
  # ============================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-paperless
    identifiers:
      name: Paperless OIDC
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: paperless
      client_secret: "${paperless_client_secret}"
      grant_types:
        - authorization_code
        - refresh_token
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://paperless.kms-lab.in.ua/accounts/oidc/authentik/login/callback/

  - model: authentik_core.application
    id: app-paperless
    identifiers:
      slug: paperless
    attrs:
      name: Paperless-ngx
      provider: !KeyOf provider-paperless
      meta_launch_url: https://paperless.kms-lab.in.ua/
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/paperless-ngx.png
      meta_description: Document Management System
      group: Home & Productivity
      policy_engine_mode: any

  # ============================================================================
  # 2. Grafana (OIDC Provider & Application)
  # ============================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-grafana
    identifiers:
      name: Grafana OIDC
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: "${grafana_client_secret}"
      grant_types:
        - authorization_code
        - refresh_token
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.kms-lab.in.ua/login/generic_oauth

  - model: authentik_core.application
    id: app-grafana
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf provider-grafana
      meta_launch_url: https://grafana.kms-lab.in.ua/login/generic_oauth
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/grafana.png
      meta_description: Observability, Metrics & Logs Dashboards
      group: Infrastructure
      policy_engine_mode: any

  # ============================================================================
  # 3. Immich (OIDC Provider & Application — Web + Mobile App)
  # ============================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-immich
    identifiers:
      name: Immich OIDC
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: immich
      client_secret: "${immich_client_secret}"
      grant_types:
        - authorization_code
        - refresh_token
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://immich.kms-lab.in.ua/auth/login
        - matching_mode: strict
          url: https://immich.kms-lab.in.ua/user-settings
        - matching_mode: strict
          url: app.immich:///oauth-callback

  - model: authentik_core.application
    id: app-immich
    identifiers:
      slug: immich
    attrs:
      name: Immich Photos
      provider: !KeyOf provider-immich
      meta_launch_url: https://immich.kms-lab.in.ua/
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/immich.png
      meta_description: Self-Hosted Photo & Video Backup with AI Search
      group: Home & Productivity
      policy_engine_mode: any

  # ============================================================================
  # 4. Portainer (OIDC Provider & Application)
  # ============================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-portainer
    identifiers:
      name: Portainer OIDC
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: portainer
      client_secret: "${portainer_client_secret}"
      grant_types:
        - authorization_code
        - refresh_token
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://portainer.home.arpa
        - matching_mode: strict
          url: https://portainer.home.arpa/

  - model: authentik_core.application
    id: app-portainer
    identifiers:
      slug: portainer
    attrs:
      name: Portainer
      provider: !KeyOf provider-portainer
      meta_launch_url: https://portainer.home.arpa/
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/portainer.png
      meta_description: QNAP NAS Docker Compose & Container Management
      group: Infrastructure
      policy_engine_mode: any

  # ============================================================================
  # 6. Longhorn UI (Traefik ForwardAuth Proxy Provider & Application)
  # ============================================================================
  - model: authentik_providers_proxy.proxyprovider
    id: provider-longhorn
    identifiers:
      name: Longhorn ForwardAuth
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://longhorn.kms-lab.in.ua

  - model: authentik_core.application
    id: app-longhorn
    identifiers:
      slug: longhorn
    attrs:
      name: Longhorn Storage
      provider: !KeyOf provider-longhorn
      meta_launch_url: https://longhorn.kms-lab.in.ua/
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/longhorn.png
      meta_description: Distributed Block Storage Dashboard
      group: Infrastructure
      policy_engine_mode: any

  # ============================================================================
  # 7. Mailpit (Traefik ForwardAuth Proxy Provider & Application)
  # ============================================================================
  - model: authentik_providers_proxy.proxyprovider
    id: provider-mailpit
    identifiers:
      name: Mailpit ForwardAuth
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://mailpit.kms-lab.in.ua

  - model: authentik_core.application
    id: app-mailpit
    identifiers:
      slug: mailpit
    attrs:
      name: Mailpit
      provider: !KeyOf provider-mailpit
      meta_launch_url: https://mailpit.kms-lab.in.ua/
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mailpit.png
      meta_description: SMTP Catcher & Email Testing UI
      group: Infrastructure
      policy_engine_mode: any

  # ============================================================================
  # 8. Traefik Dashboard (Traefik ForwardAuth Proxy Provider & Application)
  # ============================================================================
  - model: authentik_providers_proxy.proxyprovider
    id: provider-traefik
    identifiers:
      name: Traefik ForwardAuth
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://traefik.kms-lab.in.ua

  - model: authentik_core.application
    id: app-traefik
    identifiers:
      slug: traefik
    attrs:
      name: Traefik Ingress
      provider: !KeyOf provider-traefik
      meta_launch_url: https://traefik.kms-lab.in.ua/dashboard/
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/traefik.png
      meta_description: Kubernetes Ingress Controller & Routes Dashboard
      group: Infrastructure
      policy_engine_mode: any

  # ============================================================================
  # 9. ESPHome (Traefik ForwardAuth Proxy Provider & Application)
  # ============================================================================
  - model: authentik_providers_proxy.proxyprovider
    id: provider-esphome
    identifiers:
      name: ESPHome ForwardAuth
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://esphome.kms-lab.in.ua

  - model: authentik_core.application
    id: app-esphome
    identifiers:
      slug: esphome
    attrs:
      name: ESPHome
      provider: !KeyOf provider-esphome
      meta_launch_url: https://esphome.kms-lab.in.ua/
      meta_icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/esphome.png
      meta_description: Smart Home ESP32/ESP8266 Firmware & mDNS Dashboard
      group: Home & Productivity
      policy_engine_mode: any

  # ============================================================================
  # 10. Embedded Outpost Binding (attaches all ForwardAuth providers)
  # ============================================================================
  - model: authentik_outposts.outpost
    id: embedded-outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf provider-longhorn
        - !KeyOf provider-mailpit
        - !KeyOf provider-traefik
        - !KeyOf provider-esphome
      config:
        authentik_host: https://auth.kms-lab.in.ua
        authentik_host_browser: https://auth.kms-lab.in.ua
        authentik_host_insecure: false
        log_level: info
        object_naming_template: ak-outpost-%(name)s
        kubernetes_namespace: default
