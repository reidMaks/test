  # 17. Embedded Outpost Binding (attaches all ForwardAuth providers)
  # ============================================================================
  - model: authentik_outposts.outpost
    id: embedded-outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf provider-longhorn
        - !KeyOf provider-mailpit
        - !KeyOf provider-traefik
        - !KeyOf provider-esphome
        - !KeyOf provider-gatus
        - !KeyOf provider-speedtest
        - !KeyOf provider-pairdrop
        - !KeyOf provider-headlamp
        - !KeyOf provider-sonarr
        - !KeyOf provider-radarr
        - !KeyOf provider-prowlarr
        - !KeyOf provider-lidarr
        - !KeyOf provider-bazarr
        - !KeyOf provider-qbittorrent
        - !KeyOf provider-traefik-qnap
      config:
        authentik_host: https://auth.kms-lab.in.ua
        authentik_host_browser: https://auth.kms-lab.in.ua
        authentik_host_insecure: false
        log_level: info
        object_naming_template: ak-outpost-%(name)s
        kubernetes_namespace: default
