# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json

defaultPodOptions:
  nodeSelector:
    topology.kubernetes.io/zone: oci

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hargata/lubelogger
          tag: "v1.7.4"
        env:
          DOTNET_gcServer: "0"
          DOTNET_GCConserveMemory: "9"
          MALLOC_TRIM_THRESHOLD_: "131072"
          MALLOC_ARENA_MAX: "2"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        envFrom:
          - secretRef:
              name: lubelogger-env


service:
  app:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: lubelogger.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  # Том для завантажених фотографій, документів та конфігурацій (в OCI Object Storage)
  data:
    type: persistentVolumeClaim
    existingClaim: lubelogger-files-s3
    advancedMounts:
      main:
        main:
          - path: /App/data
            subPath: data
          - path: /App/wwwroot/images
            subPath: images
          - path: /App/wwwroot/documents
            subPath: documents
          - path: /App/wwwroot/translations
            subPath: translations

  # Том для ключів сесій ASP.NET, щоб не "розлогінювало" після рестарту поду (в тому ж бакеті)
  keys:
    type: persistentVolumeClaim
    existingClaim: lubelogger-files-s3
    advancedMounts:
      main:
        main:
          - path: /root/.aspnet/DataProtection-Keys
            subPath: keys
