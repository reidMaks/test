controllers:
  main:
    containers:
      main:
        image:
          repository: twinproduction/gatus
          tag: v5.7.0
        env:
          GATUS_CONFIG_PATH: /config/config.yaml
          HTTP_PROXY: "http://wg-hub-proxy.wg-hub.svc.cluster.local:3128"
          HTTPS_PROXY: "http://wg-hub-proxy.wg-hub.svc.cluster.local:3128"
          NO_PROXY: "localhost,127.0.0.1,.cluster.local,.svc,paperless-app,searxng-http,lubelogger,tandoor-app,actualbudget"
        envFrom:
          - secretRef:
              name: gatus-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi

defaultPodOptions:
  nodeSelector:
    topology.kubernetes.io/zone: oci

service:
  app:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: status.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  config:
    type: configMap
    name: gatus-config
    advancedMounts:
      main:
        main:
          - path: /config
