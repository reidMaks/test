ingressRoute:
  create: true
  entryPoints: ["web", "websecure"]
  rule: "Host(`pairdrop.kms-lab.in.ua`)"
  tls: {}

env:
  - name: WS_FALLBACK
    value: "true"

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - home
