nodeSelector:
  topology.kubernetes.io/zone: home

ingressRoute:
  create: true
  entryPoints: ["web", "websecure"]
  rule: "Host(`pairdrop.kms-lab.in.ua`)"
  middlewares:
    - name: authentik-forwardauth
      namespace: default
  annotations:
    gatus.io/status: "[STATUS] == 200 || [STATUS] == 302"
  tls: {}

env:
  - name: WS_FALLBACK
    value: "true"

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
