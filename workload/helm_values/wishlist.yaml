# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json

configMaps:
  litestream-config:
    enabled: true
    data:
      litestream.yml: |
        addr: ":9090"
        dbs:
          - path: /usr/src/app/data/prod.db
            replica:
              url: s3://kms-lab-data/wishlist-db?endpoint=${oci_s3_endpoint}&region=eu-zurich-1&forcePathStyle=true
              sync-interval: 10m

controllers:
  main:
    pod:
      labels:
        litestream-metrics: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    containers:
      main:
        image:
          repository: ghcr.io/cmintey/wishlist
          tag: "v0.65.2"
        command:
          - sh
          - -c
          - |
            sed -i 's/pnpm prisma.*//g' entrypoint.sh && sh entrypoint.sh
        env:
          - name: ORIGIN
            value: "https://wishlist.kms-lab.in.ua"
          - name: TOKEN_TIME
            value: "72"
          - name: DEFAULT_CURRENCY
            value: "UAH"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 512Mi
    initContainers:
      02-wishlist-migrate:
        image:
          repository: ghcr.io/cmintey/wishlist
          tag: "v0.65.2"
        command:
          - sh
          - -c
          - pnpm prisma migrate deploy && pnpm prisma db seed && pnpm db:patch
        env:
          - name: DATABASE_URL
            value: "file:/usr/src/app/data/prod.db"

service:
  app:
    controller: main
    ports:
      http:
        port: 3280

ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: wishlist.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  # This is where user image uploads will be stored
  uploads:
    type: persistentVolumeClaim
    existingClaim: wishlist-uploads-s3
    globalMounts:
      - path: /usr/src/app/uploads

  data:
    type: emptyDir
    globalMounts:
      - path: /usr/src/app/data

  litestream-config:
    type: configMap
    name: wishlist
    advancedMounts:
      main:
        litestream:
          - path: /etc/litestream.yml
            subPath: litestream.yml
        01-litestream-restore:
          - path: /etc/litestream.yml
            subPath: litestream.yml
