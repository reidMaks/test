# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json



defaultPodOptions:
  nodeSelector:
    topology.kubernetes.io/zone: oci

controllers:
  main:
    pod:
      labels:
        litestream-metrics: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    containers:
      main:
        image:
          repository: ghcr.io/cmintey/wishlist
          tag: "v0.69.0"
        command:
          - sh
          - -c
          - |
            sed -i 's/pnpm prisma.*//g' entrypoint.sh && sh entrypoint.sh
        env:
          - name: ORIGIN
            value: "https://wishlist.kms-lab.in.ua"
          - name: TOKEN_TIME
            value: "72"
          - name: DEFAULT_CURRENCY
            value: "UAH"
          - name: NODE_OPTIONS
            value: "--max-old-space-size=128"
          - name: MALLOC_ARENA_MAX
            value: "2"
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 384Mi
    initContainers:
      02-wishlist-migrate:
        image:
          repository: ghcr.io/cmintey/wishlist
          tag: "v0.69.0"
        command:
          - sh
          - -c
          - pnpm prisma migrate deploy && pnpm prisma db seed && pnpm db:patch
        env:
          - name: DATABASE_URL
            value: "file:/usr/src/app/data/prod.db"

service:
  app:
    controller: main
    ports:
      http:
        port: 3280

ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: wishlist.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  # This is where user image uploads will be stored
  uploads:
    type: persistentVolumeClaim
    existingClaim: wishlist-uploads-s3
    globalMounts:
      - path: /usr/src/app/uploads

  data:
    type: emptyDir
    globalMounts:
      - path: /usr/src/app/data
