# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json

controllers:
  main:
    containers:
      main:
        image:
          repository: vabene1111/recipes
          tag: "2.6.11"
        env:
          DB_ENGINE: "django.db.backends.postgresql"
          POSTGRES_HOST: "shared-db-rw.cnpg-system.svc.cluster.local"
          POSTGRES_DB: "db_recipes"
          POSTGRES_PORT: "5432"
          POSTGRES_USER: "tandoor"
          STATIC_URL: "/staticfiles/"
          MEDIA_URL: "/media/"
          GUNICORN_MEDIA: "1"
          ALLOWED_HOSTS: "*"
          CSRF_TRUSTED_ORIGINS: 'https://{{ (first .Values.ingress.main.hosts).host }}'
        envFrom:
          - secretRef:
              name: tandoor-secrets
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            memory: 2Gi

service:
  app:
    controller: main
    ports:
      http:
        port: 80

ingress:
  main:
    enabled: true
    className: "traefik"
    annotations:
      gatus.io/status: "[STATUS] == 200 || [STATUS] == 302"
    hosts:
      - host: tandoor.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  staticfiles:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /opt/recipes/staticfiles
  mediafiles:
    type: persistentVolumeClaim
    existingClaim: tandoor-mediafiles-s3
    advancedMounts:
      main:
        main:
          - path: /opt/recipes/mediafiles
