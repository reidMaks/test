defaultDashboardsEnabled: true

# Налаштування Grafana
grafana:
  enabled: true
  nodeSelector:
    topology.kubernetes.io/zone: home
  admin:
    existingSecret: "grafana-secrets"
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: "grafana-secrets"
  "grafana.ini":
    server:
      root_url: https://grafana.kms-lab.in.ua
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      client_id: grafana
      scopes: openid profile email
      auth_url: https://auth.kms-lab.in.ua/application/o/authorize/
      token_url: https://auth.kms-lab.in.ua/application/o/token/
      api_url: https://auth.kms-lab.in.ua/application/o/userinfo/
      signout_redirect_url: https://auth.kms-lab.in.ua/application/o/grafana/end-session/
      role_attribute_path: "contains(groups[*], 'authentik Admins') && 'GrafanaAdmin' || 'Viewer'"
      allow_assign_grafana_admin: true
  ingress:
    enabled: true
    ingressClassName: "traefik"
    path: /
    pathType: ImplementationSpecific
    hosts:
      - grafana.kms-lab.in.ua
  plugins:
    - victoriametrics-logs-datasource

defaultDatasources:
  extra:
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://vlogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428
      isDefault: false

# Налаштування бази даних VictoriaMetrics
vmsingle:
  enabled: true
  spec:
    nodeSelector:
      topology.kubernetes.io/zone: home
    retentionPeriod: "7d"
    storage:
      resources:
        requests:
          storage: 2Gi
      storageClassName: "longhorn-postgres"

# Налаштування збирачів метрик
vmagent:
  enabled: true
  spec:
    nodeSelector:
      topology.kubernetes.io/zone: home
    scrapeInterval: "60s" # Опитуємо раз на хвилину замість 10-15 сек
    inlineRelabelConfig:
      # Викидаємо метрики Go та процесів (внутрішня статистика програм)
      - action: drop
        sourceLabels: [__name__]
        regex: "^(go_|process_).*"
      # Викидаємо мережеву статистику по віртуальних інтерфейсах подів
      - action: drop
        sourceLabels: [device]
        regex: "^(veth.*|cali.*|flannel.*|cni.*)$"
      # Викидаємо детальні гістограми (займають купу місця, потрібні рідко)
      - action: drop
        sourceLabels: [__name__]
        regex: ".*_bucket"
      # Викидаємо дуже детальні метрики cadvisor (I/O, TCP, FS inodes тощо)
      - action: drop
        sourceLabels: [__name__]
        regex: "^(container_network_tcp_.*|container_memory_failures_total|container_fs_inodes_.*|container_blkio_.*)$"
      # Викидаємо labels та annotations (генерують безліч непотрібних time series)
      - action: drop
        sourceLabels: [__name__]
        regex: "^(kube_.*_labels|kube_.*_annotations|kube_.*_created)$"
      # Викидаємо специфічні та рідко потрібні метрики node_exporter
      - action: drop
        sourceLabels: [__name__]
        regex: "^(node_arp_.*|node_sockstat_.*|node_nf_conntrack_.*|node_netstat_.*|node_timex_.*)$"
      # Викидаємо системні метрики контрол-плейну, якщо вони збираються
      - action: drop
        sourceLabels: [__name__]
        regex: "^(apiserver_.*|etcd_.*|rest_client_.*|scheduler_.*|workqueue_.*)$"

vmalert:
  enabled: true
  spec:
    nodeSelector:
      topology.kubernetes.io/zone: home

alertmanager:
  enabled: true
  spec:
    nodeSelector:
      topology.kubernetes.io/zone: home

victoria-metrics-operator:
  nodeSelector:
    topology.kubernetes.io/zone: home

# Вбудовані exporters для Kubernetes
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  nodeSelector:
    topology.kubernetes.io/zone: home
nodeExporter:
  enabled: true
prometheus-node-exporter:
  enabled: true

# У Talos Linux kube-controller-manager, kube-scheduler та etcd слухають лише 127.0.0.1
# (а їхні метрики все одно відкидаються в inlineRelabelConfig вище), тому вимикаємо
# порожні ServiceScrape, щоб не генерувати постійні помилки скрейпінгу та фантомні алерти.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
