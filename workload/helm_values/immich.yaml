.shared-env: &shared-env
  DB_URL: "postgresql://immich:${db_password}@shared-db-rw.cnpg-system.svc.cluster.local:5432/immich"
  DB_VECTOR_EXTENSION: "pgvector"
  REDIS_HOSTNAME: "shared-redis.default.svc.cluster.local"
  REDIS_PASSWORD: "${redis_password}"
  REDIS_PORT: "6379"
  REDIS_DBINDEX: "3"
  IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"
  IMMICH_MEDIA_LOCATION: "/data/immich"

server:
  controllers:
    main:
      containers:
        main:
          env: *shared-env
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: release
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
              gpu.intel.com/i915: 1
            limits:
              memory: 2Gi
              gpu.intel.com/i915: 1
  ingress:
    main:
      enabled: true
      className: "traefik"
      hosts:
        - host: immich.kms-lab.in.ua
          paths:
            - path: "/"
              service:
                identifier: main

machine-learning:
  controllers:
    main:
      containers:
        main:
          env: *shared-env
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            # OpenVINO build: uses the Intel iGPU via /dev/dri/renderD128, which the
            # Intel device plugin injects together with the gpu.intel.com/i915 share.
            # The plain "release" tag is CPU-only and ignores the GPU request.
            tag: release-openvino
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
              gpu.intel.com/i915: 1
            limits:
              # OpenVINO runtime + models need more headroom than the CPU build
              memory: 3Gi
              gpu.intel.com/i915: 1
          # The chart hardcodes timeoutSeconds: 1 on all three probes. That is
          # fine for the CPU build, but OpenVINO compiles each model for the iGPU
          # on first use and blocks /ping well past a second, so kubelet SIGTERMs
          # the container mid-load and it restarts into the same load forever.
          # Chart values win over immich.machine-learning.hardcodedValues
          # (merge $ctx.Values hardcoded), so overriding spec here is enough.
          probes:
            liveness:
              spec:
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 10
            readiness:
              spec:
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 6
            startup:
              spec:
                timeoutSeconds: 10
                failureThreshold: 120
  persistence:
    # Chart default is an emptyDir, so every pod restart re-downloads the full
    # model set -- exactly the traffic and memory churn that hurts while the
    # container is looping. Keep the cache on disk instead.
    cache:
      type: persistentVolumeClaim
      storageClass: "longhorn"
      accessMode: ReadWriteOnce
      size: 10Gi

immich:
  persistence:
    library:
      enabled: true
      existingClaim: immich-photos-nfs
