# Keel Helm Chart Values
# Documentation: https://keel.sh/docs/

# Polling configuration
polling:
  enabled: true
  defaultSchedule: "@every 1m"

# Helm provider support: disabled as workloads are managed directly via native Kubernetes Deployments
helmProvider:
  enabled: false

# Notification delivery via native Webhook to ntfy
# (Shoutrrr's ntfy service rejects Keel's 'level' parameter as invalid key, native Webhook posts directly to ntfy endpoint)
webhook:
  enabled: true
  endpoint: "https://ntfy.sh/TusHLjYwah424h"

shoutrrr:
  enabled: false
  urls: []

# Resource requests & limits for lightweight operation
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

# RBAC settings
rbac:
  enabled: true
  serviceAccount:
    create: true
  clusterRole:
    create: true
