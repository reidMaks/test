# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json

defaultPodOptions:
  nodeSelector:
    topology.kubernetes.io/zone: home

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/paperless-ngx/paperless-ngx
          tag: "3.3.2"
        env:
          PAPERLESS_URL: 'https://{{ (first .Values.ingress.main.hosts).host }}'
          PAPERLESS_REDIS: "redis://:${redis_password}@shared-redis:6379/1"
          PAPERLESS_DBENGINE: "postgresql"
          PAPERLESS_DBHOST: "shared-db-rw.cnpg-system.svc.cluster.local"
          PAPERLESS_DBPORT: "5432"
          PAPERLESS_DBUSER: "paperless"
          PAPERLESS_DBNAME: "paperless"
          # Timezone and defaults
          PAPERLESS_TIME_ZONE: "Europe/Kyiv"
          PAPERLESS_OCR_LANGUAGE: "ukr+eng"
          PAPERLESS_OCR_LANGUAGES: "ukr"
          # Concurrency limits to prevent OOMKill on multi-page scans within 2Gi limit
          PAPERLESS_TASK_WORKERS: "1"
          PAPERLESS_THREADS_PER_WORKER: "2"
          PYTHONOPTIMIZE: "1"
          MALLOC_TRIM_THRESHOLD_: "65536"
          MALLOC_ARENA_MAX: "2"
          # OIDC / Authentik SSO (regular login & API tokens remain enabled for iOS app and MCP)
          PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
          PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
          PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
          PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
          PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP: "authentik Admins"
          PAPERLESS_SOCIAL_ACCOUNT_SYNC_STAFF_GROUP: "authentik Admins"
        envFrom:
          - secretRef:
              name: paperless-secrets
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/bash
                - -c
                - "sleep 30 && document_index reindex --no-progress > /tmp/reindex.log 2>&1 &"





service:
  app:
    controller: main
    ports:
      http:
        port: 8000



ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: paperless.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  index:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /usr/src/paperless/data
  media:
    type: persistentVolumeClaim
    existingClaim: paperless-media-s3
    advancedMounts:
      main:
        main:
          - path: /usr/src/paperless/media
  consume:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /usr/src/paperless/consume
  export:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /usr/src/paperless/export
