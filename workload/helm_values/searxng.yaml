replicaCount: 2
image:
  repository: searxng/searxng
  tag: "2026.9.25-487f51922"
  imagePullPolicy: Always


ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: "searxng.kms-lab.in.ua"
      paths:
        - path: "/"
          pathType: "Prefix"

redis:
  enabled: false

env:
  - name: SEARXNG_REDIS_URL
    value: "redis://:${redis_password}@shared-redis:6379/2"

searxng:
  base_url: "https://searxng.kms-lab.in.ua"

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    memory: 512Mi
