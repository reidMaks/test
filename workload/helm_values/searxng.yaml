image:
  repository: searxng/searxng
  tag: "latest"
  imagePullPolicy: Always


ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: "searxng.kms-lab.in.ua"
      paths:
        - path: "/"
          pathType: "Prefix"

redis:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

searxng:
  base_url: "https://searxng.kms-lab.in.ua"

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    memory: 512Mi
