# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json

controllers:
  backend:
    containers:
      main:
        image:
          repository: ghcr.io/artcc/freelingo-backend
          tag: "latest"
        env:
          DATABASE_URL: "postgresql+asyncpg://freelingo:${db_password}@shared-db-rw.cnpg-system.svc.cluster.local:5432/freelingo"
          REDIS_URL: "redis://:${redis_password}@shared-redis:6379/0"

          # LLM Config (OpenRouter)
          LLM_PROVIDER: "openai"
          OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
          OPENAI_MODEL: "qwen/qwen3.7-flash"

          # Voice Config (Local)
          TTS_PROVIDER: "local"
          TTS_BASE_URL: "http://freelingo-kokoro:8880"
          STT_PROVIDER: "local"
          STT_BASE_URL: "http://freelingo-whisper:9000"

          CORS_ORIGINS: '["https://freelingo.kms-lab.in.ua"]'
          APP_BASE_URL: "https://freelingo.kms-lab.in.ua"
          ALLOW_REGISTRATION: "true"
          FIRST_USER_IS_ADMIN: "true"
        envFrom:
          - secretRef:
              name: freelingo-secrets
        command:
          - sh
          - -c
          - "cd /tmp && PYTHONPATH=/app alembic -c /app/alembic.ini upgrade head && cd /app && uvicorn app.main:app --host 0.0.0.0 --port 8000"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi

  frontend:
    containers:
      main:
        image:
          repository: ghcr.io/reidmaks/freelingo-frontend
          tag: "latest"
        env:
          BACKEND_URL: "http://freelingo-backend:8000"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

  kokoro:
    containers:
      main:
        image:
          repository: ghcr.io/remsky/kokoro-fastapi-cpu
          tag: "latest"
        env:
          PYTHONUNBUFFERED: "1"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi

  whisper:
    pod:
      # Keep transcription on the home nodes: the oci zone is arm64 with 2
      # cores already at ~98% CPU requests, and medium needs real headroom.
      # The home control-plane node carries a NoSchedule taint, so this
      # selector effectively pins to talos-f9o-10o / talos-wfh-33w.
      nodeSelector:
        topology.kubernetes.io/zone: home
    containers:
      main:
        image:
          repository: onerahmet/openai-whisper-asr-webservice
          tag: "latest"
        env:
          ASR_MODEL: "medium"
          ASR_ENGINE: "faster_whisper"
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 4Gi





service:
  backend:
    controller: backend
    ports:
      http:
        port: 8000
  frontend:
    controller: frontend
    ports:
      http:
        port: 3000
  kokoro:
    controller: kokoro
    ports:
      http:
        port: 8880
  whisper:
    controller: whisper
    ports:
      http:
        port: 9000



ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: freelingo.kms-lab.in.ua
        paths:
          - path: /api
            service:
              identifier: backend
              port: http
          - path: /
            service:
              identifier: frontend
              port: http
      # Exposed so Bazarr on the QNAP can use it as a subtitle ASR backend.
      # Per ADR 002 this host is intentionally absent from cloudflare.tf, so
      # the wildcard A-record keeps it on the WG-only address.
      - host: whisper.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: whisper
              port: http

persistence:
  data-s3:
    type: persistentVolumeClaim
    existingClaim: freelingo-data-s3
    advancedMounts:
      backend:
        main:
          - path: /app/avatars
            subPath: avatars
          - path: /data/audio
            subPath: audio

  patches:
    type: configMap
    name: freelingo-patches
    advancedMounts:
      backend:
        main:
          - path: /app/app/schemas/auth.py
            subPath: auth.py
            readOnly: true
          - path: /app/app/schemas/admin.py
            subPath: admin.py
            readOnly: true
