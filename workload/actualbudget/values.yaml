# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json

defaultPodOptions:
  nodeSelector:
    topology.kubernetes.io/zone: oci

controllers:
  main:
    pod:
      labels:
        litestream-metrics: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "ob.nordigen.com"
            - "bankaccountdata.gocardless.com"
            - "api.nordigen.com"

    initContainers:
      01-litestream-restore:
        image:
          repository: alpine
          tag: "3.24"
        securityContext:
          runAsUser: 0
        command:
          - sh
          - /scripts/restore.sh
        envFrom:
          - secretRef:
              name: litestream-s3
      init-certs:
        image:
          repository: mitmproxy/mitmproxy
          tag: "12.3.0"
        command: ["sh", "-c", "mitmdump --set confdir=/certs & sleep 5; kill $!"]

    containers:
      main:
        image:
          repository: actualbudget/actual-server
          tag: "26.10.0"
        env:
          NODE_EXTRA_CA_CERTS: "/certs/mitmproxy-ca-cert.pem"
          LOG_LEVEL: "WARNING"
          ACTUAL_OPENID_PROVIDER_NAME: "Authentik"
          ACTUAL_OPENID_AUTHORIZATION_ENDPOINT: "https://auth.kms-lab.in.ua/application/o/authorize/"
          ACTUAL_OPENID_TOKEN_ENDPOINT: "http://authentik-server.default.svc.cluster.local/application/o/token/"
          ACTUAL_OPENID_USERINFO_ENDPOINT: "http://authentik-server.default.svc.cluster.local/application/o/userinfo/"
          ACTUAL_OPENID_CLIENT_ID: "actual"
          ACTUAL_OPENID_CLIENT_SECRET: "${actual_oidc_client_secret}"
          ACTUAL_OPENID_SERVER_HOSTNAME: "https://actual.kms-lab.in.ua"
          ACTUAL_OPENID_AUTH_METHOD: "oauth2"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

      backup-files:
        image:
          repository: alpine
          tag: "3.24"
        securityContext:
          runAsUser: 0
        command:
          - sh
          - /scripts/backup.sh
        envFrom:
          - secretRef:
              name: litestream-s3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi

      mitmproxy:
        image:
          repository: mitmproxy/mitmproxy
          tag: "12.3.0"
        securityContext:
          runAsUser: 0
        command:
          - mitmdump
          - "-q"
          - "--listen-port"
          - "443"
          - "--mode"
          - "reverse:https://1.1.1.1"
          - "--set"
          - "confdir=/certs"
          - "-s"
          - "/scripts/addon.py"
        env:
          MONOBANK_TOKEN: "${monobank_token}"
          LOG_LEVEL: "INFO"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi

configMaps:
  mitm-addon:
    enabled: true
    data:
      addon.py: |
        ${indent(8, addon_py)}

  scripts:
    enabled: true
    data:
      restore.sh: |
        #!/bin/sh
        set -eu
        apk add --no-cache wget tar rsync
        LITESTREAM_VERSION="0.5.17"
        ARCH=$(uname -m)
        if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
          LITESTREAM_ARCH="arm64"
          LITESTREAM_SHA256="f8ca4a050095c1efbda2c4365172e61bf9d955ea0d9ac42f448b52e51819baa5"
        else
          LITESTREAM_ARCH="x86_64"
          LITESTREAM_SHA256="cfb371176d164437ae869f8351cfde49bd1804ae71c61923f75c9cba9c9c006d"
        fi
        TARBALL="/tmp/litestream.tar.gz"
        wget -q "https://github.com/benbjohnson/litestream/releases/download/v$${LITESTREAM_VERSION}/litestream-$${LITESTREAM_VERSION}-linux-$${LITESTREAM_ARCH}.tar.gz" -O "$TARBALL"
        echo "$${LITESTREAM_SHA256}  $${TARBALL}" | sha256sum -c -
        tar -xzf "$TARBALL" -C /usr/local/bin
        rm -f "$TARBALL"

        export LITESTREAM_ACCESS_KEY_ID=$MINIO_ACCESS_KEY
        export LITESTREAM_SECRET_ACCESS_KEY=$MINIO_SECRET_KEY

        echo "Listing databases in s3-db PVC..."
        # Litestream stores WAL data inside directories named after the DB file in the S3 replica bucket.
        # Since we use recursive: true, the paths in S3 preserve the relative path from /data (e.g. server-files/account.sqlite)
        find /s3-db -type d -name "*.sqlite" | while read -r db_dir; do
          # Get relative path from /s3-db/ (e.g. server-files/account.sqlite)
          db_path=$(echo "$db_dir" | sed 's|^/s3-db/||')

          echo "Restoring /data/$db_path..."
          mkdir -p "/data/$(dirname "$db_path")"
          litestream restore -if-replica-exists -if-db-not-exists -o "/data/$db_path" "s3://kms-lab-data/actualbudget-db/$db_path?endpoint=${s3_endpoint}&region=us-east-1&forcePathStyle=true"
        done

        echo "Restoring non-SQLite files from S3..."
        mkdir -p /data/user-files /data/server-files
        rsync -a --exclude="*.sqlite*" /s3-data/ /data/ || true
      backup.sh: |
        #!/bin/sh
        apk add --no-cache rsync inotify-tools

        # Initial sync
        rsync -a --exclude="*.sqlite*" /data/ /s3-data/ > /dev/null 2>&1

        # Fallback sync every 10 minutes in the background
        (
          while true; do
            sleep 600
            rsync -a --exclude="*.sqlite*" /data/ /s3-data/ > /dev/null 2>&1
          done
        ) &

        # Immediate sync on file changes
        while inotifywait -r -e modify,create,delete,move --exclude '.*\.sqlite.*' /data/; do
          sleep 1
          rsync -a --exclude="*.sqlite*" /data/ /s3-data/ > /dev/null 2>&1
        done

service:
  app:
    controller: main
    ports:
      http:
        port: 5006

ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: actual.kms-lab.in.ua
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  data:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /data
        litestream:
          - path: /data
        backup-files:
          - path: /data
        01-litestream-restore:
          - path: /data
  s3-data:
    type: persistentVolumeClaim
    existingClaim: actualbudget-files-s3
    advancedMounts:
      main:
        backup-files:
          - path: /s3-data
        01-litestream-restore:
          - path: /s3-data
  s3-db:
    type: persistentVolumeClaim
    existingClaim: actualbudget-db-s3
    advancedMounts:
      main:
        01-litestream-restore:
          - path: /s3-db
  scripts:
    type: configMap
    name: actualbudget-scripts
    defaultMode: 0755
    advancedMounts:
      main:
        backup-files:
          - path: /scripts
        01-litestream-restore:
          - path: /scripts
  certs:
    type: emptyDir
    advancedMounts:
      main:
        init-certs:
          - path: /certs
        main:
          - path: /certs
        mitmproxy:
          - path: /certs
  addon:
    type: configMap
    name: actualbudget-mitm-addon
    advancedMounts:
      main:
        mitmproxy:
          - path: /scripts
