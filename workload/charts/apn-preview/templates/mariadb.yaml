apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apn-preview.fullname" . }}-mariadb
  labels:
    app.kubernetes.io/component: database
    {{- include "apn-preview.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: {{ include "apn-preview.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: {{ include "apn-preview.fullname" . }}
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: home
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.wordpress.env.WORDPRESS_DB_NAME | quote }}
            - name: MARIADB_USER
              value: {{ .Values.wordpress.env.WORDPRESS_DB_USER | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apn-preview.fullname" . }}-secrets
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apn-preview.fullname" . }}-secrets
                  key: MARIADB_ROOT_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: mariadb-ephemeral-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mariadb-admin", "ping", "-h", "localhost"]
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["mariadb-admin", "ping", "-h", "localhost"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: mariadb-ephemeral-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apn-preview.fullname" . }}-mariadb
  labels:
    app.kubernetes.io/component: database
    {{- include "apn-preview.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: {{ include "apn-preview.fullname" . }}
