apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apn-preview.fullname" . }}-wordpress
  labels:
    app.kubernetes.io/component: web
    {{- include "apn-preview.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/instance: {{ include "apn-preview.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/instance: {{ include "apn-preview.fullname" . }}
    spec:
      {{- with .Values.wordpress.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MariaDB at {{ include "apn-preview.fullname" . }}-mariadb:3306..."
              until nc -z -w 2 {{ include "apn-preview.fullname" . }}-mariadb 3306; do
                sleep 1
              done
              echo "MariaDB is ready!"
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ include "apn-preview.fullname" . }}-mariadb:3306"
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.wordpress.env.WORDPRESS_DB_NAME | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.wordpress.env.WORDPRESS_DB_USER | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apn-preview.fullname" . }}-secrets
                  key: WORDPRESS_DB_PASSWORD
            - name: WORDPRESS_TABLE_PREFIX
              value: {{ .Values.wordpress.env.WORDPRESS_TABLE_PREFIX | quote }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                /* Reverse Proxy HTTPS settings for Traefik */
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                    $_SERVER['HTTPS'] = 'on';
                }
                define('WP_HOME', 'https://{{ include "apn-preview.host" . }}');
                define('WP_SITEURL', 'https://{{ include "apn-preview.host" . }}');
                define('WP_CACHE', true);
                define('WP_MEMORY_LIMIT', '256M');
                define('WP_MAX_MEMORY_LIMIT', '512M');
                define('DISALLOW_FILE_MODS', true);
                define('AUTOMATIC_UPDATER_DISABLED', true);
                define('WP_AUTO_UPDATE_CORE', false);
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: uploads-ephemeral
              mountPath: /var/www/html/wp-content/uploads
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Auto-initialize WordPress core & plugins if clean preview DB
                    sleep 4
                    if ! wp core is-installed --path=/var/www/html --allow-root 2>/dev/null; then
                      wp core install \
                        --path=/var/www/html \
                        --url="https://{{ include "apn-preview.host" . }}" \
                        --title="APN PR-{{ .Values.pr }} Preview" \
                        --admin_user="{{ .Values.adminUser }}" \
                        --admin_password="{{ .Values.adminPassword }}" \
                        --admin_email="{{ .Values.adminEmail }}" \
                        --skip-email \
                        --allow-root || true
                      wp theme activate astra --path=/var/www/html --allow-root || true
                      wp plugin activate woocommerce tutor cache-enabler --path=/var/www/html --allow-root || true
                    fi
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "apn-preview.host" . | quote }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "apn-preview.host" . | quote }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: uploads-ephemeral
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apn-preview.fullname" . }}-wordpress
  labels:
    app.kubernetes.io/component: web
    {{- include "apn-preview.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: {{ include "apn-preview.fullname" . }}
