---
# ==========================================
# 1. VALKEY (База даних / Кеш)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-valkey
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng-valkey
  template:
    metadata:
      labels:
        app: searxng-valkey
    spec:
      containers:
      - name: valkey
        image: docker.io/valkey/valkey:9-alpine
        command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: searxng-valkey
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: searxng-valkey
  ports:
    - port: 6379
      targetPort: 6379

---
# ==========================================
# 2. SEARXNG (Головний додаток)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng
        ports:
        - containerPort: 8080
        env:
        # Вказуємо базову адресу (дуже важливо для маршрутизації всередині SearXNG)
        - name: SEARXNG_BASE_URL
          value: "https://searxng.kms-lab.in.ua"
        # Вказуємо адресу нашого внутрішнього сервісу Valkey
        - name: SEARXNG_REDIS_URL
          value: "redis://searxng-valkey:6379/0"

---
apiVersion: v1
kind: Service
metadata:
  name: searxng-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: searxng
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
# ==========================================
# 3. INGRESS (Маршрутизація трафіку)
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: searxng.kms-lab.in.ua
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: searxng-service
            port:
              number: 80