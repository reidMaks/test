name: Build openwebui-knowledge MCP server

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mcp-servers/openwebui-knowledge/**'
      - '.github/workflows/build-openwebui-knowledge-mcp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel
        working-directory: mcp-servers/openwebui-knowledge
        run: uv build --wheel

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwebui-knowledge-mcp-latest
          name: openwebui-knowledge-mcp (latest)
          make_latest: true
          files: mcp-servers/openwebui-knowledge/dist/*.whl
