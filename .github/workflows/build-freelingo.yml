name: Build FreeLingo Frontend (Multi-arch)

on:
  push:
    paths:
      - 'tmp/uk.json'
      - '.github/workflows/build-freelingo.yml'
  workflow_dispatch: # Дозволяє запускати збірку вручну з інтерфейсу GitHub

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository (IaaC)
        uses: actions/checkout@v4
        with:
          path: 'iaac-repo'

      - name: Checkout FreeLingo repository
        uses: actions/checkout@v4
        with:
          repository: 'artcc/freelingo'
          path: 'freelingo-src'

      - name: Inject Ukrainian localization
        run: |
          # Копіюємо файл перекладу
          cp iaac-repo/tmp/uk.json freelingo-src/messages/uk.json

          # Додаємо 'uk' у список підтримуваних мов
          sed -i "/'ru',/a \ \ 'uk'," freelingo-src/frontend/src/lib/locales.ts

          # Оновлюємо клієнтський детектор мови
          sed -i "s/'ru'/'ru','uk'/g" freelingo-src/frontend/src/app/layout.tsx

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GitHub username
        id: downcase
        run: echo "REPO_OWNER=${GITHUB_ACTOR,,}" >> $GITHUB_ENV

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./freelingo-src
          file: ./freelingo-src/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/freelingo-frontend:latest
