version: "2.1"

volumes:
  traefik-conf:

networks:
  proxy:
    external: true

services:
  traefik-configurator:
    image: alpine:latest
    container_name: traefik-configurator
    volumes:
      - traefik-conf:/conf
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache openssl
        mkdir -p /conf/certs
        if [ ! -f /conf/certs/home-arpa.crt ]; then
          echo "Generating new Local CA and Wildcard Certificate..."
          openssl req -x509 -nodes -newkey rsa:4096 -keyout /conf/certs/local-ca.key -out /conf/certs/local-ca.crt -days 3650 -subj "/O=Home Network/CN=Home Local CA"
          openssl req -nodes -newkey rsa:2048 -keyout /conf/certs/home-arpa.key -out /conf/certs/home-arpa.csr -subj "/O=Home Network/CN=*.home.arpa"
          echo "subjectAltName=DNS:*.home.arpa,DNS:home.arpa,DNS:seerr.home.arpa,DNS:jellyfin.home.arpa,DNS:qb.home.arpa,DNS:portainer.home.arpa,DNS:sonarr.home.arpa,DNS:radarr.home.arpa,DNS:prowlarr.home.arpa,DNS:traefik.home.arpa,DNS:nas72ffeb.home.arpa,DNS:pve.kms-lab.in.ua" > /conf/certs/extfile.cnf
          openssl x509 -req -in /conf/certs/home-arpa.csr -CA /conf/certs/local-ca.crt -CAkey /conf/certs/local-ca.key -CAcreateserial -out /conf/certs/home-arpa.crt -days 398 -extfile /conf/certs/extfile.cnf
        fi
        cat << 'EOF' > /conf/dynamic.yml
        tls:
          stores:
            default:
              defaultCertificate:
                certFile: /etc/traefik/dynamic_conf/certs/home-arpa.crt
                keyFile: /etc/traefik/dynamic_conf/certs/home-arpa.key
        http:
          routers:
            proxmox:
              rule: "Host(`pve.kms-lab.in.ua`)"
              service: proxmox-svc
              tls: {}
            portainer:
              rule: "Host(`portainer.home.arpa`)"
              service: portainer-svc
              tls: {}
            qnap:
              rule: "Host(`nas72ffeb.home.arpa`)"
              service: qnap-svc
              tls: {}
          services:
            proxmox-svc:
              loadBalancer:
                servers:
                  - url: "https://192.168.0.26:8006"
            portainer-svc:
              loadBalancer:
                servers:
                  - url: "https://portainer:9443"
            qnap-svc:
              loadBalancer:
                servers:
                  - url: "https://host.docker.internal:4433"
        EOF
        echo "Traefik config generated successfully"

  traefik-qnap:
    depends_on:
      traefik-configurator:
        condition: service_completed_successfully
    image: traefik:v3.0
    container_name: traefik-qnap
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=proxy"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.tls=true"
      - "--api.dashboard=true"
      - "--serverstransport.insecureskipverify=true"
      - "--providers.file.directory=/etc/traefik/dynamic_conf"
    ports:
      - 80:80
      - 443:443
    networks:
      proxy:
        aliases:
          - jellyfin.home.arpa
          - seerr.home.arpa
          - sonarr.home.arpa
          - radarr.home.arpa
          - qb.home.arpa
          - prowlarr.home.arpa
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-conf:/etc/traefik/dynamic_conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-ui.rule=Host(`traefik.home.arpa`)"
      - "traefik.http.routers.traefik-ui.service=api@internal"
