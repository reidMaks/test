version: "2.1"

networks:
  proxy:
    external: true

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    dns:
      - 192.168.0.1
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Kyiv
      - WEBUI_PORT=8085
      # --- WebUI та SSO (Authentik ForwardAuth) ---
      # Локалізація інтерфейсу
      - QBT_LOCALE=uk
      # Вимикає запит пароля для localhost (127.0.0.1) та дозволених підмереж,
      # оскільки авторизацію повністю контролює Traefik + Authentik ForwardAuth
      - QBT_BYPASS_LOCAL_AUTH=true
      - QBT_AUTH_SUBNET_WHITELIST_ENABLED=true
      - QBT_AUTH_SUBNET_WHITELIST=192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8
      # Має бути false: qBittorrent не вміє парсити CIDR у ReverseProxiesList,
      # тому беремо IP контейнера traefik-qnap (172.16.0.0/12) напряму
      - QBT_REVERSE_PROXY_ENABLED=false
      - QBT_CSRF_PROTECTION=false
      - QBT_HOST_HEADER_VALIDATION=false
      - QBT_CLICKJACKING_PROTECTION=true
      - QBT_SECURE_COOKIE=true
      # --- Дисковий ввід/вивід та RAM (оптимізовано під QNAP HDD RAID) ---
      # Тип роботи з диском: Posix (2) замість Default/mmap (0).
      # Забігає роздуванню RAM (page cache) та зависанням контейнера при пробудженні HDD
      - QBT_DISK_IO_TYPE_INI=Posix
      - QBT_DISK_IO_TYPE_API=2
      # Ліміт робочого набору пам'яті в МіБ (запобіжник для фізичної RAM)
      - QBT_MEMORY_WORKING_SET_LIMIT=512
      # Кількість потоків асинхронного I/O: зменшено з 10 до 4 (рекомендація libtorrent
      # для механічних HDD RAID, щоб уникнути зайвого смикання голівок диска)
      - QBT_ASYNC_IO_THREADS=4
      # 1 потік хешування ідеально для HDD (перевірка файлів не блокує паралельні операції)
      - QBT_HASHING_THREADS=1
      # Ліміт відкритих файлових дескрипторів (замість дефолтних 5000 у libtorrent)
      - QBT_FILE_POOL_SIZE=100
      # Розмір черги диска: збільшено з 1 МіБ до 4 МіБ (4194304 байт) для згладжування
      # піків запису на HDD на гігабітному каналі
      - QBT_DISK_QUEUE_SIZE=4194304
      # Об'єднання суміжних операцій читання/запису та групування шматків (зменшує фрагментацію HDD)
      - QBT_COALESCE_READ_WRITE=true
      - QBT_PIECE_EXTENT_AFFINITY=true
      - QBT_RECHECK_COMPLETED=false
      # --- Шляхи збереження та авто керування торентами (TMM) ---
      - QBT_SAVE_PATH=/torrent/Downloads
      - QBT_TEMP_PATH_ENABLED=true
      - QBT_TEMP_PATH=/torrent/Downloads/temp
      - QBT_SCAN_DIR=/torrent/utp-free-leech
      - QBT_TORRENT_CHANGED_TMM=true
      - QBT_SAVE_PATH_CHANGED_TMM=false
      - QBT_CATEGORY_CHANGED_TMM=false
      # --- Мережа, протоколи та приватні трекери ---
      - QBT_LISTEN_PORT=34760
      - QBT_UPNP=false
      - QBT_RANDOM_PORT=false
      # 0 = Пріоритет TCP над uTP (оптимально для оптоволокна, де uTP штучно ріже швидкість)
      - QBT_UTP_TCP_MIXED_MODE=0
      - QBT_PEER_TOS=0
      - QBT_DHT=true
      - QBT_PEX=true
      - QBT_LSD=true
      # 0 = Дозволити шифрування (Allow encryption)
      - QBT_ENCRYPTION=0
      # Вимкнено (false): anonymous_mode ховає User-Agent/Peer-ID, через що приватні трекери
      # (Toloka, Rutracker) та cross-seed можуть відхиляти анонси
      - QBT_ANONYMOUS_MODE=false
      - QBT_BLOCK_PRIVILEGED_PORTS=false
      # --- Ліміти з'єднань, слотів роздачі та рейтинг ---
      # Зменшено з 1000 до 500 глобальних з'єднань для зменшення навантаження на роутер і HDD
      - QBT_MAX_CONNEC=500
      - QBT_MAX_CONNEC_PER_TORRENT=100
      # Обмежено слоти роздачі (20 глобально / 10 на торент замість безлімітних -1),
      # щоб десятки пірів не смикали головки HDD одночасно на низькій швидкості
      - QBT_MAX_UPLOADS=20
      - QBT_MAX_UPLOADS_PER_TORRENT=10
      # Черга вимкнена, щоб усі торенти залишались активними для роздачі та cross-seed
      - QBT_QUEUEING_ENABLED=false
      # Зупиняти роздачу (act=0) при досягненні рейтингу 10.0
      - QBT_MAX_RATIO_ENABLED=true
      - QBT_MAX_RATIO=10
      - QBT_MAX_RATIO_ACT=0
      # --- Ліміти швидкості ---
      - QBT_DL_LIMIT=0
      - QBT_UP_LIMIT=0
      # Альтернативні ліміти швидкості ("режим черепашки"): 2048000 Б/с (~2 МБ/с)
      - QBT_ALT_DL_LIMIT=2048000
      - QBT_ALT_UP_LIMIT=2048000
      # Не обмежувати швидкість для локальних пірів у LAN (було true)
      - QBT_LIMIT_LAN_PEERS=false
      - QBT_LIMIT_UTP_RATE=true
      - QBT_LIMIT_TCP_OVERHEAD=false
    entrypoint:
      - /bin/sh
      - -c
      - |
        CONF="/config/qBittorrent/qBittorrent.conf"
        if [ -f "$$CONF" ]; then
          sed -i "s|^WebUI\\\\AuthSubnetWhitelist=.*|WebUI\\\\AuthSubnetWhitelist=$$QBT_AUTH_SUBNET_WHITELIST|" "$$CONF"
          sed -i "s|^WebUI\\\\AuthSubnetWhitelistEnabled=.*|WebUI\\\\AuthSubnetWhitelistEnabled=$$QBT_AUTH_SUBNET_WHITELIST_ENABLED|" "$$CONF"
          sed -i "s|^WebUI\\\\LocalHostAuth=.*|WebUI\\\\LocalHostAuth=false|" "$$CONF"
          sed -i "s|^WebUI\\\\ReverseProxySupportEnabled=.*|WebUI\\\\ReverseProxySupportEnabled=$$QBT_REVERSE_PROXY_ENABLED|" "$$CONF"
          if grep -q "^Session\\\\DiskIOType=" "$$CONF"; then
            sed -i "s|^Session\\\\DiskIOType=.*|Session\\\\DiskIOType=$$QBT_DISK_IO_TYPE_INI|" "$$CONF"
          else
            sed -i "/^\[BitTorrent\]/a Session\\\\DiskIOType=$$QBT_DISK_IO_TYPE_INI" "$$CONF"
          fi
        fi
        (
          for i in $$(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$$WEBUI_PORT/api/v2/app/version" >/dev/null 2>&1; then
              PREFS_JSON=$$(printf '{
                "locale": "%s",
                "bypass_local_auth": %s,
                "bypass_auth_subnet_whitelist_enabled": %s,
                "bypass_auth_subnet_whitelist": "%s",
                "web_ui_reverse_proxy_enabled": %s,
                "web_ui_csrf_protection_enabled": %s,
                "web_ui_host_header_validation_enabled": %s,
                "web_ui_clickjacking_protection_enabled": %s,
                "web_ui_secure_cookie_enabled": %s,
                "disk_io_type": %s,
                "memory_working_set_limit": %s,
                "async_io_threads": %s,
                "hashing_threads": %s,
                "file_pool_size": %s,
                "disk_queue_size": %s,
                "enable_coalesce_read_write": %s,
                "enable_piece_extent_affinity": %s,
                "recheck_completed_torrents": %s,
                "save_path": "%s",
                "temp_path_enabled": %s,
                "temp_path": "%s",
                "scan_dirs": {"%s": 1},
                "torrent_changed_tmm_enabled": %s,
                "save_path_changed_tmm_enabled": %s,
                "category_changed_tmm_enabled": %s,
                "listen_port": %s,
                "upnp": %s,
                "random_port": %s,
                "utp_tcp_mixed_mode": %s,
                "peer_tos": %s,
                "dht": %s,
                "pex": %s,
                "lsd": %s,
                "encryption": %s,
                "anonymous_mode": %s,
                "block_peers_on_privileged_ports": %s,
                "max_connec": %s,
                "max_connec_per_torrent": %s,
                "max_uploads": %s,
                "max_uploads_per_torrent": %s,
                "queueing_enabled": %s,
                "max_ratio_enabled": %s,
                "max_ratio": %s,
                "max_ratio_act": %s,
                "dl_limit": %s,
                "up_limit": %s,
                "alt_dl_limit": %s,
                "alt_up_limit": %s,
                "limit_lan_peers": %s,
                "limit_utp_rate": %s,
                "limit_tcp_overhead": %s
              }' \
                "$$QBT_LOCALE" \
                "$$QBT_BYPASS_LOCAL_AUTH" \
                "$$QBT_AUTH_SUBNET_WHITELIST_ENABLED" \
                "$$QBT_AUTH_SUBNET_WHITELIST" \
                "$$QBT_REVERSE_PROXY_ENABLED" \
                "$$QBT_CSRF_PROTECTION" \
                "$$QBT_HOST_HEADER_VALIDATION" \
                "$$QBT_CLICKJACKING_PROTECTION" \
                "$$QBT_SECURE_COOKIE" \
                "$$QBT_DISK_IO_TYPE_API" \
                "$$QBT_MEMORY_WORKING_SET_LIMIT" \
                "$$QBT_ASYNC_IO_THREADS" \
                "$$QBT_HASHING_THREADS" \
                "$$QBT_FILE_POOL_SIZE" \
                "$$QBT_DISK_QUEUE_SIZE" \
                "$$QBT_COALESCE_READ_WRITE" \
                "$$QBT_PIECE_EXTENT_AFFINITY" \
                "$$QBT_RECHECK_COMPLETED" \
                "$$QBT_SAVE_PATH" \
                "$$QBT_TEMP_PATH_ENABLED" \
                "$$QBT_TEMP_PATH" \
                "$$QBT_SCAN_DIR" \
                "$$QBT_TORRENT_CHANGED_TMM" \
                "$$QBT_SAVE_PATH_CHANGED_TMM" \
                "$$QBT_CATEGORY_CHANGED_TMM" \
                "$$QBT_LISTEN_PORT" \
                "$$QBT_UPNP" \
                "$$QBT_RANDOM_PORT" \
                "$$QBT_UTP_TCP_MIXED_MODE" \
                "$$QBT_PEER_TOS" \
                "$$QBT_DHT" \
                "$$QBT_PEX" \
                "$$QBT_LSD" \
                "$$QBT_ENCRYPTION" \
                "$$QBT_ANONYMOUS_MODE" \
                "$$QBT_BLOCK_PRIVILEGED_PORTS" \
                "$$QBT_MAX_CONNEC" \
                "$$QBT_MAX_CONNEC_PER_TORRENT" \
                "$$QBT_MAX_UPLOADS" \
                "$$QBT_MAX_UPLOADS_PER_TORRENT" \
                "$$QBT_QUEUEING_ENABLED" \
                "$$QBT_MAX_RATIO_ENABLED" \
                "$$QBT_MAX_RATIO" \
                "$$QBT_MAX_RATIO_ACT" \
                "$$QBT_DL_LIMIT" \
                "$$QBT_UP_LIMIT" \
                "$$QBT_ALT_DL_LIMIT" \
                "$$QBT_ALT_UP_LIMIT" \
                "$$QBT_LIMIT_LAN_PEERS" \
                "$$QBT_LIMIT_UTP_RATE" \
                "$$QBT_LIMIT_TCP_OVERHEAD")
              curl -fsS -X POST "http://127.0.0.1:$$WEBUI_PORT/api/v2/app/setPreferences" \
                --data-urlencode "json=$$PREFS_JSON" >/dev/null 2>&1 && break
            fi
            sleep 1
          done
        ) &
        exec /init
    # Верхній ліміт cgroup для захисту 4 ГБ RAM хоста (QBT_MEMORY_WORKING_SET_LIMIT тримає робочий набір у межах 512 МіБ)
    mem_limit: 768m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/qbittorrent:/config
      - /share/CACHEDEV1_DATA/torrent:/torrent
    ports:
      - 8085:8085
      - 34760:34760
      - 34760:34760/udp
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qb.home.arpa`) || Host(`qbittorrent.home.arpa`)"
      - "traefik.http.routers.qbittorrent.middlewares=authentik@docker"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8085"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    dns:
      - 192.168.0.1
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Kyiv
      # --- Оптимізація .NET GC та glibc під 4 ГБ ARM64 NAS ---
      # Workstation GC замість Server GC (одна купа замість 4 окремих куп на кожне ядро CPU)
      - DOTNET_gcServer=0
      # Максимальна економія пам'яті (1..9): агресивна компактифікація купи та повернення сторінок ОС
      - DOTNET_GCConserveMemory=9
      # Змушує glibc повертати звільнену пам'ять ядру Linux і обмежує кількість арен з 32 до 2
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_ARENA_MAX=2
    # .NET автоматично зчитує mem_limit з cgroup і підлаштовує поріг GC під 350 МіБ замість 4 ГБ хоста
    mem_limit: 350m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/prowlarr:/config
    ports:
      - 9696:80
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.home.arpa`)"
      - "traefik.http.routers.prowlarr.middlewares=authentik@docker"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=80"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    dns:
      - 192.168.0.1
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Kyiv
      # --- Оптимізація .NET GC та glibc під 4 ГБ ARM64 NAS ---
      - DOTNET_gcServer=0
      - DOTNET_GCConserveMemory=9
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_ARENA_MAX=2
    mem_limit: 350m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/sonarr:/config
      - /share/CACHEDEV1_DATA/torrent:/torrent
    ports:
      - 8989:80
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.home.arpa`)"
      - "traefik.http.routers.sonarr.middlewares=authentik@docker"
      - "traefik.http.services.sonarr.loadbalancer.server.port=80"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    dns:
      - 192.168.0.1
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Kyiv
      # --- Оптимізація .NET GC та glibc під 4 ГБ ARM64 NAS ---
      - DOTNET_gcServer=0
      - DOTNET_GCConserveMemory=9
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_ARENA_MAX=2
    mem_limit: 350m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/radarr:/config
      - /share/CACHEDEV1_DATA/torrent:/torrent
    ports:
      - 7878:80
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.home.arpa`)"
      - "traefik.http.routers.radarr.middlewares=authentik@docker"
      - "traefik.http.services.radarr.loadbalancer.server.port=80"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    dns:
      - 192.168.0.1
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Kyiv
      # --- Оптимізація .NET GC та glibc під 4 ГБ ARM64 NAS ---
      - DOTNET_gcServer=0
      - DOTNET_GCConserveMemory=9
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_ARENA_MAX=2
    mem_limit: 350m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/lidarr:/config
      - /share/CACHEDEV1_DATA/torrent:/torrent
    ports:
      - 8686:80
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.home.arpa`)"
      - "traefik.http.routers.lidarr.middlewares=authentik@docker"
      - "traefik.http.services.lidarr.loadbalancer.server.port=80"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    dns:
      - 192.168.0.1
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Kyiv
      # --- Оптимізація Python та glibc ---
      # Не зберігати docstrings у пам'яті байткоду Python
      - PYTHONOPTIMIZE=1
      # Повертати звільнені сторінки пам'яті ядру Linux після пошуку/парсингу субтитрів
      - MALLOC_TRIM_THRESHOLD_=65536
      - MALLOC_ARENA_MAX=2
    mem_limit: 350m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/bazarr:/config
      - /share/CACHEDEV1_DATA/torrent:/torrent
    ports:
      - 6767:6767
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.home.arpa`)"
      - "traefik.http.routers.bazarr.middlewares=authentik@docker"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    user: "0:0"
    environment:
      - TZ=Europe/Kyiv
      # Змінено з debug на info, щоб прибрати безперервний фоновий запис логів на диск
      - LOG_LEVEL=info
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # Обмеження купи V8 (Node.js 22), щоб не роздувати RAM при фонових синхронізаціях
      - NODE_OPTIONS=--max-old-space-size=160
      - MALLOC_ARENA_MAX=2
    mem_limit: 350m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/seerr:/app/config
    ports:
      - 5055:5055
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.home.arpa`)"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    container_name: cross-seed
    dns:
      - 192.168.0.1
    environment:
      - TZ=Europe/Kyiv
      # Обмеження купи V8 для фонового демона cross-seed
      - NODE_OPTIONS=--max-old-space-size=128
      - MALLOC_ARENA_MAX=2
    mem_limit: 256m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/cross-seed:/config
      - /share/CACHEDEV1_DATA/torrent:/torrent
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/qbittorrent/qBittorrent/BT_backup:/torrent-dir:ro
    ports:
      - 2468:2468
    networks:
      - proxy
    command: daemon
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cross-seed.rule=Host(`cross-seed.home.arpa`)"
      - "traefik.http.services.cross-seed.loadbalancer.server.port=2468"

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Kyiv
      # --- Оптимізація .NET 8 GC та glibc для медіасервера ---
      - DOTNET_gcServer=0
      - DOTNET_GCConserveMemory=9
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_ARENA_MAX=2
      # --- Транскодування та ffmpeg (/config/encoding.xml) ---
      # Обмеження потоків ffmpeg до 2 (із 4 ядер CPU), щоб транскодування не блокувало NAS
      - JELLYFIN_ENCODING_THREADS=2
      # Дроселювання транскодування: ставити ffmpeg на паузу, коли буфер попереду на 180 с
      - JELLYFIN_ENABLE_THROTTLING=true
      - JELLYFIN_THROTTLE_DELAY_SECONDS=180
      # Автоматично видаляти вже переглянуті сегменти HLS старіші за 720 с (12 хв),
      # щоб не забивати диск і Page Cache під час перегляду
      - JELLYFIN_ENABLE_SEGMENT_DELETION=true
      - JELLYFIN_SEGMENT_KEEP_SECONDS=720
      # На QNAP ARM Cortex-A55 апаратного енкодера немає, тому використовуємо швидкий пресет CPU
      - JELLYFIN_HW_ACCEL_TYPE=none
      - JELLYFIN_ENCODER_PRESET=superfast
      - JELLYFIN_DOWNMIX_AUDIO_BOOST=2
      - JELLYFIN_MAX_MUXING_QUEUE_SIZE=2048
      # --- Система, локалізація та фонові задачі (/config/system.xml) ---
      - JELLYFIN_SERVER_NAME=nas-jellyfin
      - JELLYFIN_PublishedServerUrl=http://192.168.0.21:8096
      - JELLYFIN_ENABLE_IPV6=false
      - JELLYFIN_UI_CULTURE=uk
      - JELLYFIN_METADATA_LANG=uk
      - JELLYFIN_METADATA_COUNTRY=UA
      - JELLYFIN_LOG_RETENTION_DAYS=3
      # Обмеження паралельності при скануванні бібліотеки та обробці обкладинок (замість 0=Auto)
      - JELLYFIN_LIBRARY_SCAN_CONCURRENCY=2
      - JELLYFIN_METADATA_REFRESH_CONCURRENCY=2
      - JELLYFIN_PARALLEL_IMAGE_ENCODING_LIMIT=1
      # Витягувати лише ключові кадри (keyframes) для прев'ю перемотування (Trickplay) — у ~20 разів менше CPU
      - JELLYFIN_TRICKPLAY_KEYFRAME_ONLY=true
      - JELLYFIN_TRICKPLAY_THREADS=1
    entrypoint:
      - /bin/sh
      - -c
      - |
        ENC="/config/encoding.xml"
        if [ -f "$$ENC" ]; then
          sed -i "s|<EncodingThreadCount>.*</EncodingThreadCount>|<EncodingThreadCount>$$JELLYFIN_ENCODING_THREADS</EncodingThreadCount>|" "$$ENC"
          sed -i "s|<EnableThrottling>.*</EnableThrottling>|<EnableThrottling>$$JELLYFIN_ENABLE_THROTTLING</EnableThrottling>|" "$$ENC"
          sed -i "s|<ThrottleDelaySeconds>.*</ThrottleDelaySeconds>|<ThrottleDelaySeconds>$$JELLYFIN_THROTTLE_DELAY_SECONDS</ThrottleDelaySeconds>|" "$$ENC"
          sed -i "s|<EnableSegmentDeletion>.*</EnableSegmentDeletion>|<EnableSegmentDeletion>$$JELLYFIN_ENABLE_SEGMENT_DELETION</EnableSegmentDeletion>|" "$$ENC"
          sed -i "s|<SegmentKeepSeconds>.*</SegmentKeepSeconds>|<SegmentKeepSeconds>$$JELLYFIN_SEGMENT_KEEP_SECONDS</SegmentKeepSeconds>|" "$$ENC"
          sed -i "s|<HardwareAccelerationType>.*</HardwareAccelerationType>|<HardwareAccelerationType>$$JELLYFIN_HW_ACCEL_TYPE</HardwareAccelerationType>|" "$$ENC"
          sed -i "s|<EncoderPreset>.*</EncoderPreset>|<EncoderPreset>$$JELLYFIN_ENCODER_PRESET</EncoderPreset>|" "$$ENC"
          sed -i "s|<DownMixAudioBoost>.*</DownMixAudioBoost>|<DownMixAudioBoost>$$JELLYFIN_DOWNMIX_AUDIO_BOOST</DownMixAudioBoost>|" "$$ENC"
          sed -i "s|<MaxMuxingQueueSize>.*</MaxMuxingQueueSize>|<MaxMuxingQueueSize>$$JELLYFIN_MAX_MUXING_QUEUE_SIZE</MaxMuxingQueueSize>|" "$$ENC"
        fi
        SYS="/config/system.xml"
        if [ -f "$$SYS" ]; then
          sed -i "s|<ServerName>.*</ServerName>|<ServerName>$$JELLYFIN_SERVER_NAME</ServerName>|" "$$SYS"
          sed -i "s|<UICulture>.*</UICulture>|<UICulture>$$JELLYFIN_UI_CULTURE</UICulture>|" "$$SYS"
          sed -i "s|<PreferredMetadataLanguage>.*</PreferredMetadataLanguage>|<PreferredMetadataLanguage>$$JELLYFIN_METADATA_LANG</PreferredMetadataLanguage>|" "$$SYS"
          sed -i "s|<MetadataCountryCode>.*</MetadataCountryCode>|<MetadataCountryCode>$$JELLYFIN_METADATA_COUNTRY</MetadataCountryCode>|" "$$SYS"
          sed -i "s|<LogFileRetentionDays>.*</LogFileRetentionDays>|<LogFileRetentionDays>$$JELLYFIN_LOG_RETENTION_DAYS</LogFileRetentionDays>|" "$$SYS"
          sed -i "s|<LibraryScanFanoutConcurrency>.*</LibraryScanFanoutConcurrency>|<LibraryScanFanoutConcurrency>$$JELLYFIN_LIBRARY_SCAN_CONCURRENCY</LibraryScanFanoutConcurrency>|" "$$SYS"
          sed -i "s|<LibraryMetadataRefreshConcurrency>.*</LibraryMetadataRefreshConcurrency>|<LibraryMetadataRefreshConcurrency>$$JELLYFIN_METADATA_REFRESH_CONCURRENCY</LibraryMetadataRefreshConcurrency>|" "$$SYS"
          sed -i "s|<ParallelImageEncodingLimit>.*</ParallelImageEncodingLimit>|<ParallelImageEncodingLimit>$$JELLYFIN_PARALLEL_IMAGE_ENCODING_LIMIT</ParallelImageEncodingLimit>|" "$$SYS"
          sed -i "s|<EnableKeyFrameOnlyExtraction>.*</EnableKeyFrameOnlyExtraction>|<EnableKeyFrameOnlyExtraction>$$JELLYFIN_TRICKPLAY_KEYFRAME_ONLY</EnableKeyFrameOnlyExtraction>|" "$$SYS"
          sed -i "s|<ProcessThreads>.*</ProcessThreads>|<ProcessThreads>$$JELLYFIN_TRICKPLAY_THREADS</ProcessThreads>|" "$$SYS"
        fi
        NET="/config/network.xml"
        if [ -f "$$NET" ]; then
          sed -i "s|<AutoDiscovery>.*</AutoDiscovery>|<AutoDiscovery>true</AutoDiscovery>|" "$$NET"
          sed -i "s|<EnableIPv6>.*</EnableIPv6>|<EnableIPv6>$$JELLYFIN_ENABLE_IPV6</EnableIPv6>|" "$$NET"
          sed -i '/<LocalNetworkAddresses>/,/<\/LocalNetworkAddresses>/c\  <LocalNetworkAddresses />' "$$NET"
          sed -i '/<PublishedServerUriBySubnet>/,/<\/PublishedServerUriBySubnet>/c\  <PublishedServerUriBySubnet />' "$$NET"
          sed -i "s|<PublishedServerUriBySubnet />|<PublishedServerUriBySubnet>\n    <string>all=$$JELLYFIN_PublishedServerUrl</string>\n  </PublishedServerUriBySubnet>|" "$$NET"
        fi
        exec /init
    mem_limit: 1200m
    volumes:
      - /share/CACHEDEV2_DATA/appdata/arr-stack/config/jellyfin:/config
      - /share/CACHEDEV1_DATA/torrent:/torrent
    network_mode: host
    restart: unless-stopped
