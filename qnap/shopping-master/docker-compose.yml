services:
  shopping-master:
    image: git.kms-lab.in.ua/max/shopping-master:latest
    container_name: shopping-master
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - stack.env
    environment:
      - TZ=Europe/Kyiv
      - DB_PATH=/data/shopping.db
      - TOKEN_CACHE_DIR=/data
      - AGY_BIN=agy
      - WEBAPP_URL=https://shopping.kms-lab.in.ua
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=8080
    volumes:
      - /home/max/shopping-master/data:/data
      - /home/max/.gemini:/root/.gemini
