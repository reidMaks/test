[project]
name = "openwebui-knowledge-mcp"
version = "0.1.0"
description = "MCP server for read-only access to Open WebUI knowledge bases (list + vector search)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
openwebui-knowledge-mcp = "openwebui_knowledge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwebui_knowledge_mcp"]
